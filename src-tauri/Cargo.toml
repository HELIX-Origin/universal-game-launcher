[package]
name = "universal-game-launcher"
version = "1.4.1"
description = "A cross-platform universal game launcher and library organizer"
authors = ["HELIX Origin"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "universal_game_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
rusqlite = { version = "0.33", features = ["bundled"] }
flate2 = "1.0"
urlencoding = "2.1"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
